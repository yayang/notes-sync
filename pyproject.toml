[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-sync"
version = "0.1.0"
description = "Synchronize Toggl Track data to Notion and Obsidian."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.33.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "typer>=0.21.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]
